name: master builder

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - core
          - extension
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev # sqweek/dialog needs GTK3 headers
      - name: Setup Golang env
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # conflict with golangci-lint cache
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.0
          working-directory: ${{ matrix.directory }}
  unit-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev # sqweek/dialog needs GTK3 headers
      - name: Setup Golang env
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build
      - name: Unit Test
        # 跳过 e2e test 目录（需要连 Telegram 服务器，CI 不跑）
        run: go test -v $(go list ./... | grep -vE '(^|/)test(/|$)')
  # 每次 push master 自动编译 Windows 版 tmm（exe + 前端），打包上传 artifact 供下载测试
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git describe 需要 tag 历史
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: Install web deps
        working-directory: web/app
        run: npm ci
      - name: Build frontend
        working-directory: web/app
        run: npm run build
      - name: Build tmm.exe
        shell: bash
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "unknown")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          DATE=$(git log -1 --format=%cd --date=format:%Y-%m-%dT%H:%M:%S 2>/dev/null || echo "unknown")
          echo "版本: $VERSION (commit $DATE)"
          go build -ldflags="-s -w \
            -X github.com/iyear/tdl/pkg/consts.Version=$VERSION \
            -X github.com/iyear/tdl/pkg/consts.Commit=$COMMIT \
            -X github.com/iyear/tdl/pkg/consts.CommitDate=$DATE" \
            -o tmm.exe .
      - name: Assemble package
        shell: bash
        run: |
          # tmm 运行目录结构：exe + web/（前端产物）
          # 注意：不能用 pkg/ 做打包目录——tdl 的 pkg/ 是 Go 源码目录，会把源码打进包里
          mkdir -p bundle/web
          cp tmm.exe bundle/
          # 启动/停止脚本（发布版解压即用：双击 start.bat 启动）
          cp scripts/start.bat scripts/stop.bat scripts/clear-cache.bat bundle/
          cp -r web/app/dist/assets bundle/web/assets
          cp -r web/app/dist/twemoji bundle/web/twemoji 2>/dev/null || true
          cp -r web/app/dist/icons bundle/web/icons 2>/dev/null || true
          cp web/app/dist/index.html bundle/web/index.html
          # 打包 zip：用 PowerShell Compress-Archive（Windows tar -a 不支持 zip，
          # 会把 .zip 名写成 gzip 格式，产物打不开）
          powershell -Command "Compress-Archive -Path bundle/* -DestinationPath tmm-win64.zip -Force"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmm-win64
          path: tmm-win64.zip
  e2e-test:
    runs-on: ubuntu-22.04
    if: false # skip e2e test for now, since it is not stable
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Golang env
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo
      - name: Setup Teamgram Env
        run: |
          git clone https://github.com/iyear/teamgram-server.git
          cd teamgram-server
          git checkout 10151bb92555aa1bedcba9f8f24b0e7deac22dee
          sudo docker compose -f ./docker-compose-env.yaml up -d --quiet-pull
          sudo docker compose up -d --quiet-pull
      - name: Build
        run: go build
      - name: E2E Test
        run: ginkgo -v -r ./test
